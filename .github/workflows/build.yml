name: Build Sokoban

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64

          - os: windows-11-arm
            name: Windows-ARM64

          - os: ubuntu-latest
            name: Linux-x64

          - os: ubuntu-24.04-arm
            name: Linux-ARM64

          - os: macos-latest
            name: macOS-ARM64

          - os: macos-15-intel
            name: macOS-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Rename executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv build/Release/Sokoban.exe "Sokoban-${{ matrix.name }}.exe"
          else
            mv build/Sokoban "Sokoban-${{ matrix.name }}"
          fi

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: Sokoban-${{ matrix.name }}
          path: Sokoban-${{ matrix.name }}*
          if-no-files-found: error
            
  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download executables
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: Sokoban-*
          merge-multiple: true

      - name: Show release files
        run: ls -lah release

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Sokoban ${{ github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true